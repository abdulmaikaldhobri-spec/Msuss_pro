<style>
/* Layout: one column phone-first app. Sticky header, bottom tab bar, bottom sheets for every form. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface2:#e9eeeb; --fg:#13211e; --muted:#5b6c67; --line:#d8dfdb;
  --accent:#0a6b5c; --accent-fg:#ffffff; --accent-soft:#dbeee8;
  --good:#17794a; --good-soft:#dcf1e4; --warn:#9a5f00; --warn-soft:#faedd0; --bad:#b4291e; --bad-soft:#f8e0dd;
  --shadow:0 -6px 24px rgba(10,40,34,.10);
  --font-display:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --surface2:#1e2d2b; --fg:#e7eeec; --muted:#9bb0aa; --line:#2a3b38;
  --accent:#4cc4ad; --accent-fg:#06211c; --accent-soft:#16332e;
  --good:#52c98a; --good-soft:#15301f; --warn:#e8b04a; --warn-soft:#37290c; --bad:#f08073; --bad-soft:#3a1c19;
  --shadow:0 -6px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface2:#1e2d2b; --fg:#e7eeec; --muted:#9bb0aa; --line:#2a3b38;
  --accent:#4cc4ad; --accent-fg:#06211c; --accent-soft:#16332e;
  --good:#52c98a; --good-soft:#15301f; --warn:#e8b04a; --warn-soft:#37290c; --bad:#f08073; --bad-soft:#3a1c19;
  --shadow:0 -6px 24px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:600;text-wrap:balance}
h3{font-size:15px;margin:16px 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.cur{font-size:.82em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:720px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;line-height:1.2}
.biz{font-size:12px;color:var(--muted)}
.brand{margin-inline-start:auto;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--surface)}
.hlogo{width:38px;height:38px;object-fit:contain;border-radius:9px;background:#fff;border:1px solid var(--line);flex-shrink:0}
.alogo{width:72px;height:72px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--line);flex-shrink:0}
.about-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ct a{font-weight:600}
.back{display:inline-flex;width:38px;height:38px;border-radius:10px;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500}
.nav a.on{color:var(--accent);background:var(--accent-soft)}

/* common blocks */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}
.pagehead h2{font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-size:19px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kpi.main .l,.kpi.main .cur{color:inherit;opacity:.85}
.pos{color:var(--good)} .neg{color:var(--bad)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:11px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%;margin-top:14px}
.link{background:none;border:0;color:var(--accent);padding:4px 0;cursor:pointer;font-weight:500;text-align:start}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--fg)}
.quick svg{color:var(--accent)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.search{width:100%;margin:0 0 10px}

.row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.row .r-main{display:flex;flex-direction:column;min-width:0}
.row .r-main b{font-weight:600;overflow-wrap:anywhere}
.row .r-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;border:1px dashed var(--line);border-radius:12px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:14px}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu a{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--fg)}
.menu a b{font-family:var(--font-display);font-weight:500}
.menu a span{font-size:12.5px;color:var(--muted)}

.lines-tbl{display:flex;flex-direction:column;gap:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv.strong{font-weight:600;font-size:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
th,td{padding:7px 6px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12.5px}
td.n,th.n{text-align:end}

.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bgrp{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bpair{display:flex;align-items:flex-end;gap:3px;flex:1;width:100%;justify-content:center}
.bar{width:38%;max-width:22px;border-radius:5px 5px 0 0;min-height:2px;background:var(--accent)}
.bar.b2{background:var(--warn);opacity:.85}
.bval{font-size:11px;color:var(--muted)}
.blbl{font-size:12px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;background:var(--accent)}
.legend i.l2{background:var(--warn)}
.hbar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:4px}
.hbar>div{height:100%;background:var(--accent);border-radius:5px}

/* sheets + forms */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(5,15,13,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;position:sticky;top:-14px;background:var(--surface);padding:6px 0}
.sh-head h2{font-size:17px}
.x{background:var(--surface2);border:0;border-radius:9px;width:34px;height:34px;font-size:20px;line-height:1;cursor:pointer;flex-shrink:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-top:10px;min-width:0}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;min-height:44px;color:var(--fg)}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--fg)}
.check input{width:20px;height:20px;min-height:0;flex-shrink:0}
.line{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg)}
.line2{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end;margin-top:8px}
.line2 label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.ltot{font-weight:600;min-width:62px;text-align:end;padding-bottom:10px}
.hint{font-size:12.5px;color:var(--warn);margin-top:4px;min-height:0}
.totals{background:var(--surface2);border-radius:12px;padding:6px 12px;margin-top:12px}
textarea{min-height:240px;direction:ltr;font-family:ui-monospace,monospace;font-size:12px}

.rate-row{display:flex;gap:8px;align-items:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90%;text-align:center}
@media (max-width:380px){.quick{grid-template-columns:repeat(2,1fr)}.line2{grid-template-columns:1fr 1fr}.ltot{text-align:start}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<div class="top"><div class="top-in">
  <a class="back" id="back" href="#more" hidden aria-label="رجوع"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
  <img class="hlogo" id="hlogo" alt="" hidden>
  <div><div class="biz" id="biz"></div><h1 id="ttl"></h1></div>
  <div class="brand" dir="ltr">MUSS PRO</div>
</div></div>
<main class="wrap" id="app"></main>
<nav class="nav" aria-label="التنقل الرئيسي"><div class="nav-in" id="nav"></div></nav>
<div class="sheet-back" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
document.documentElement.dir="rtl";document.documentElement.lang="ar";
var $=function(s){return document.querySelector(s)};
var MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var UNITS=["قطعة","كرتون","كيس","علبة","كيلو","لتر","متر","ساعة"];
var EXP_CATS=["إيجار","رواتب","كهرباء وماء","اتصالات وإنترنت","تسويق وإعلان","نقل وشحن","صيانة","مستلزمات","رسوم حكومية","أخرى"];
var KEY="muss-pro-v2";
/* بيانات الدعم الفني لمزوّد البرنامج. عدّلها هنا ثم أعد النشر. */
var VENDOR={name:"",phone:"",wa:"",email:"",web:"",hours:""};
var waLink=function(num){var d=String(num||"").replace(/\D/g,"");if(d.indexOf("00")===0)d=d.slice(2);else if(d.charAt(0)==="0")d="967"+d.slice(1);else if(d.length===9&&d.charAt(0)==="7")d="967"+d;return "https://wa.me/"+d};
var pad=function(n){return String(n).padStart(2,"0")};
var isoDate=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var today=function(){return isoDate(new Date())};
var daysAgo=function(n){var d=new Date();d.setDate(d.getDate()-n);return isoDate(d)};
var r2=function(n){return Math.round(n*100)/100};
var fmt=function(n){return r2(+n||0).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2})};
var fmtQ=function(n){return (Math.round((+n||0)*1000)/1000).toLocaleString("en-US",{maximumFractionDigits:3})};
var money=function(n,c){return '<span class="num">'+fmt(n)+'</span> <span class="cur">'+esc(sym(c))+'</span>'};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var dshow=function(d){return d?'<span class="num">'+d.split("-").reverse().join("/")+'</span>':""};
var sum=function(a,f){return a.reduce(function(x,y){return x+f(y)},0)};
var compact=function(n){return Math.abs(n)>=1000?(n/1000).toFixed(1)+"k":String(Math.round(n))};

/* ---------- data ---------- */
var db, persistOK=true;
function emptyCur(){return [{code:"YER",sym:"ر.ي",name:"ريال يمني",rate:1},{code:"SAR",sym:"ر.س",name:"ريال سعودي",rate:420},{code:"USD",sym:"$",name:"دولار أمريكي",rate:1600}]}
function emptyDb(){return {v:2,demo:false,base:"YER",cur:emptyCur(),biz:{name:"نشاطي التجاري",vatNo:"",vatRate:0,logo:"",address:"",phone:"",wa:"",email:"",web:"",foot:""},seq:{s:0,p:0},products:[],contacts:[],sales:[],purchases:[],expenses:[],adjust:[],transfers:[],
  accounts:[{id:uid(),name:"الخزينة (نقدي)",cur:"YER",open:0},{id:uid(),name:"الحساب البنكي",cur:"YER",open:0}]}}
function migrate(o){
  o.base=o.base||"YER";if(!Array.isArray(o.cur)||!o.cur.length)o.cur=emptyCur();
  o.accounts.forEach(function(a){if(!a.cur)a.cur=o.base});
  ["sales","purchases"].forEach(function(k){o[k].forEach(function(d){if(!d.cur){d.cur=o.base;d.rate=1}d.pays.forEach(function(x){if(x.accAmt==null)x.accAmt=x.amt;if(!x.method)x.method="cash"})})});
  o.expenses.forEach(function(e){if(!e.cur){e.cur=o.base;e.rate=1}if(e.accAmt==null)e.accAmt=e.amt;if(!e.method)e.method="cash"});
  o.transfers.forEach(function(t){if(t.toAmt==null)t.toAmt=t.amt});
  return o}
function load(){
  try{var s=localStorage.getItem(KEY);if(s)return migrate(Object.assign(emptyDb(),JSON.parse(s)));
    var olds=["muss-pro-v1","hisabati-v1"];
    for(var i=0;i<olds.length;i++){var o=localStorage.getItem(olds[i]);if(o){var q=JSON.parse(o);if(q&&!q.demo)return migrate(Object.assign(emptyDb(),q))}}
  }catch(e){persistOK=false}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){persistOK=false}}

var prod=function(id){return db.products.find(function(p){return p.id===id})};
var contact=function(id){return db.contacts.find(function(c){return c.id===id})};
var acct=function(id){return db.accounts.find(function(a){return a.id===id})};
var paid=function(d){return sum(d.pays,function(p){return p.amt})};
var rem=function(d){return r2(d.total-paid(d))};
var docs=function(kind){return kind==="sales"?db.sales:db.purchases};
function partyName(d,kind){var c=contact(d.cid);return c?c.name:(kind==="sales"?"عميل نقدي":"مورد غير محدد")}
function stock(pid){var p=prod(pid);if(!p)return 0;var q=+p.open||0;
  db.purchases.forEach(function(d){d.lines.forEach(function(l){if(l.pid===pid)q+=l.qty})});
  db.sales.forEach(function(d){d.lines.forEach(function(l){if(l.pid===pid)q-=l.qty})});
  db.adjust.forEach(function(a){if(a.pid===pid)q+=a.delta});
  return Math.round(q*1000)/1000}
function calcDoc(lines,disc,vatOn){
  var sub=r2(sum(lines,function(l){return l.qty*(l.price!=null?l.price:l.cost)}));
  var d=Math.min(+disc||0,sub);var base=r2(sub-d);var vat=vatOn?r2(base*db.biz.vatRate/100):0;
  return {sub:sub,disc:d,base:base,vat:vat,total:r2(base+vat)}}
function rateOf(c){if(!c||c===db.base)return 1;var x=db.cur.find(function(k){return k.code===c});return x?(+x.rate||1):1}
function sym(c){var x=db.cur.find(function(k){return k.code===(c||db.base)});return x?x.sym:(c||"")}
function mkPay(d,amt,accId,method,date,ref){var a=acct(accId)||db.accounts[0];
  var accAmt=a.cur===d.cur?amt:r2(amt*d.rate/rateOf(a.cur));
  return {id:uid(),date:date,amt:amt,acc:a.id,accAmt:accAmt,method:method||"cash",ref:ref||""}}
function addSale(o){
  var cur=o.cur||db.base,rate=cur===db.base?1:(+o.rate||rateOf(cur));
  var lines=o.lines.map(function(l){var p=prod(l.pid);return {pid:l.pid,qty:l.qty,price:l.price,cost:p?p.cost:0}});
  var t=calcDoc(lines,o.disc,o.vatOn);
  var inv=Object.assign({id:uid(),no:"INV-"+String(++db.seq.s).padStart(4,"0"),date:o.date,cid:o.cid||"",cur:cur,rate:rate,lines:lines,vatOn:!!o.vatOn,note:o.note||"",pays:[]},t);
  if(o.pay>0)inv.pays.push(mkPay(inv,r2(Math.min(o.pay,t.total)),o.acc,o.method,o.date,o.ref));
  db.sales.push(inv);return inv}
function addPurchase(o){

function periodRange(k){var n=new Date(),y=n.getFullYear(),m=n.getMonth();
  if(k==="month")return [isoDate(new Date(y,m,1)),today()];
  if(k==="last")return [isoDate(new Date(y,m-1,1)),isoDate(new Date(y,m,0))];
  if(k==="q")return [isoDate(new Date(y,m-2,1)),today()];
  if(k==="year")return [isoDate(new Date(y,0,1)),today()];
  return ["0000-01-01","9999-12-31"]}
function report(k){
  var r=periodRange(k),inr=function(d){return d.date>=r[0]&&d.date<=r[1]};
  var S=db.sales.filter(inr),P=db.purchases.filter(inr),E=db.expenses.filter(inr);
  var rev=sum(S,function(d){return d.base*d.rate}),vatOut=sum(S,function(d){return d.vat*d.rate});
  var cogs=sum(S,function(d){return sum(d.lines,function(l){return l.qty*l.cost})});
  var exp=sum(E,function(e){return e.amt*e.rate}),byCat={};E.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.amt*e.rate});
  var top={};S.forEach(function(d){d.lines.forEach(function(l){var t=top[l.pid]||(top[l.pid]={qty:0,rev:0,profit:0});t.qty+=l.qty;t.rev+=l.qty*l.price*d.rate;t.profit+=l.qty*(l.price*d.rate-l.cost)})});
  var pm={cash:0,transfer:0};db.sales.forEach(function(d){d.pays.forEach(function(x){if(x.date>=r[0]&&x.date<=r[1]){var m=x.method||"cash";pm[m]=(pm[m]||0)+x.amt*d.rate}})});
  return {rev:r2(rev),vatOut:r2(vatOut),cogs:r2(cogs),gross:r2(rev-cogs),exp:r2(exp),net:r2(rev-cogs-exp),byCat:byCat,
    buy:r2(sum(P,function(d){return d.base*d.rate})),vatIn:r2(sum(P,function(d){return d.vat*d.rate})),top:top,nS:S.length,pm:pm}}
function monthSeries(n){var now=new Date(),out=[];
  for(var i=n-1;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1),key=d.getFullYear()+"-"+pad(d.getMonth()+1);
    var rev=sum(db.sales.filter(function(x){return x.date.slice(0,7)===key}),function(x){return x.base*x.rate});
    var exp=sum(db.expenses.filter(function(x){return x.date.slice(0,7)===key}),function(x){return x.amt*x.rate});
    out.push({label:MONTHS[d.getMonth()],rev:rev,exp:exp})}
  return out}

function prodMoves(pid){var m=[],p=prod(pid);

  db.sales.forEach(function(d){d.lines.forEach(function(l){if(l.pid===pid)m.push({date:d.date,label:"بيع "+d.no,q:-l.qty})})});
  db.adjust.forEach(function(a){if(a.pid===pid)m.push({date:a.date,label:"جرد وتسوية"+(a.note?" · "+a.note:""),q:a.delta})});
