<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style><title>دفتر ديون MUSS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: narrow app column, summary cards on top, searchable people list, bottom tab bar, bottom-sheet forms.
   Palette: cool grey ground, deep teal accent, green = owed to me, red = I owe. Type: Reem Kufi display + IBM Plex Sans Arabic. */
:root{
  --bg:#f2f5f4;--surface:#ffffff;--surface2:#e8eeec;--fg:#122022;--muted:#5a6a6c;--line:#d8e0de;
  --accent:#0b5d54;--accent-fg:#ffffff;--pos:#17784a;--neg:#b3392f;--warn:#a96a10;--shadow:0 10px 30px rgba(18,32,34,.16);
  --f-display:"Reem Kufi","Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1516;--surface:#162022;--surface2:#1d2a2c;--fg:#e9f0ee;--muted:#9bb0ae;--line:#2a3a3c;
  --accent:#5fd0b8;--accent-fg:#06211c;--pos:#4cc38a;--neg:#ef7b70;--warn:#e6a54a;--shadow:0 10px 30px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1516;--surface:#162022;--surface2:#1d2a2c;--fg:#e9f0ee;--muted:#9bb0ae;--line:#2a3a3c;
  --accent:#5fd0b8;--accent-fg:#06211c;--pos:#4cc38a;--neg:#ef7b70;--warn:#e6a54a;--shadow:0 10px 30px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{max-width:640px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(10px);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top .col{display:flex;align-items:center;gap:10px}
.mono{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:700 18px var(--f-display)}
.top b{font:700 20px var(--f-display);margin-inline-end:auto}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
h2.s{font:700 18px var(--f-display);margin:20px 0 8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.box small{color:var(--muted);display:block}
.box b{display:block;font:700 22px/1.3 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.box.p b{color:var(--pos)}.box.n b{color:var(--neg)}
.net{margin-top:10px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.fld{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px}
textarea.fld{height:auto;padding:10px 12px;resize:vertical}
.list{display:grid;gap:8px;margin-top:8px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--f-display);--h:200;background:color-mix(in oklab,hsl(var(--h) 55% 50%) 22%,var(--surface));color:color-mix(in oklab,hsl(var(--h) 60% 40%) 75%,var(--fg))}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted);display:block}
.amt{text-align:end;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt small{font-weight:400}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}.warn{color:var(--warn)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);display:grid;gap:10px}
.empty h3{margin:0;color:var(--fg);font:700 20px var(--f-display)}
.steps{display:grid;gap:8px;text-align:start;margin:4px 0}
.steps div{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:600}
.btn{height:46px;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--accent-fg);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1px solid transparent}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.pos{background:var(--pos);color:#fff}.btn.neg{background:var(--neg);color:#fff}
.btn.wa{background:#1f9d57;color:#fff}
.btn.sm{height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.fab{position:fixed;z-index:25;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px;border-radius:26px;box-shadow:var(--shadow)}
.nav{position:fixed;z-index:26;inset:auto 0 0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.nav button{height:50px;border-radius:12px;color:var(--muted);font-size:13.5px;display:grid;place-items:center;align-content:center;gap:0}
.nav button b{font-size:18px;line-height:1.1}
.nav button[aria-pressed="true"]{color:var(--accent);background:var(--surface2);font-weight:600}
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,14,15,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);overscroll-behavior:contain}
@media(min-width:700px){.ov{align-items:center}.panel{border-radius:18px;padding:20px 22px 24px}}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph h2{margin:0;font:700 21px var(--f-display);min-width:0;overflow-wrap:anywhere}
.big{font:700 30px/1.2 var(--f-display);font-variant-numeric:tabular-nums;margin:2px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:grid;gap:12px;margin-top:6px}
.lab{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.help{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.err{color:var(--neg);font-size:13.5px;min-height:1.2em}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.tx small{color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:6px;background:var(--surface2);margin-inline-start:6px}
.tag.late{background:color-mix(in oklab,var(--neg) 18%,var(--surface));color:var(--neg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-top:10px}
details{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;margin-top:8px}
summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:inline-end;color:var(--muted)}
details[open] summary::after{content:"−"}
details p{margin:0 0 12px;color:var(--muted)}
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:24px}
.lock .box2{width:100%;max-width:320px;display:grid;gap:12px;text-align:center}
.toast{position:fixed;inset-inline:0;bottom:calc(140px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast span{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:no-preference){.panel{animation:up .2s ease-out}@keyframes up{from{transform:translateY(22px);opacity:.4}}}
</style>

<script>
(function(){
document.documentElement.dir="rtl";document.documentElement.lang="ar";
var KEY="muss-debts-v1";
var CUR={YER:{s:"ر.ي",d:0},SAR:{s:"ر.س",d:2},USD:{s:"$",d:2}};
var $=function(i){return document.getElementById(i)};
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fresh(){return{cfg:{shop:"",cur:"YER",pin:"",hello:true,msg:"السلام عليكم {الاسم}، تذكير ودّي بأن المتبقي عليك {المبلغ} لدى {المحل}. شاكر لك تعاونك."},people:[],tx:[]}}
var S=load();
function load(){var f=fresh();try{var r=JSON.parse(localStorage.getItem(KEY)||"null");if(r){Object.keys(f.cfg).forEach(function(k){if(r.cfg&&r.cfg[k]!==undefined)f.cfg[k]=r.cfg[k]});if(Array.isArray(r.people))f.people=r.people;if(Array.isArray(r.tx))f.tx=r.tx}}catch(e){}return f}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("تعذر الحفظ على هذا الجهاز")}}
var ui={tab:"book",flt:"all",q:"",cur:null,pid:null,del:null,locked:!!S.cfg.pin,formCur:"YER",dir:1};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function dnum(s){var p=s.split("-");return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5)}
function dshow(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function money(n,c){var m=CUR[c]||CUR.YER;var t=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:m.d});return c=="USD"?m.s+t:t+" "+m.s}
function toast(m){var t=$("toast");t.innerHTML="<span>"+h(m)+"</span>";clearTimeout(toast.k);toast.k=setTimeout(function(){t.innerHTML=""},2400)}
function copy(txt,ok){var done=function(){toast(ok||"تم النسخ")};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fb)}else fb();function fb(){var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("حدد النص وانسخه يدوياً")}a.remove()}}
function waNum(n){var d=String(n||"").replace(/\D/g,"");if(!d)return"";if(d.indexOf("00")==0)d=d.slice(2);if(d.indexOf("967")==0)return d;if(d.charAt(0)=="0")d=d.slice(1);if(d.length==9&&d.charAt(0)=="7")return"967"+d;return d}
function waLink(phone,text){return"https://wa.me/"+waNum(phone)+"?text="+encodeURIComponent(text)}
function num(v){return Math.max(0,parseFloat(String(v).replace(/[٠-٩]/g,function(d){return"٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[^\d.]/g,""))||0)}
function person(id){return S.people.filter(function(p){return p.id==id})[0]}
function txOf(id){return S.tx.filter(function(t){return t.pid==id})}
function bal(id){var b={};txOf(id).forEach(function(t){b[t.cur]=(b[t.cur]||0)+t.dir*t.amt});Object.keys(b).forEach(function(k){b[k]=Math.round(b[k]*100)/100;if(!b[k])delete b[k]});return b}
function used(){var u={};S.tx.forEach(function(t){u[t.cur]=1});u[S.cfg.cur]=1;return Object.keys(CUR).filter(function(k){return u[k]})}
function totals(c){var to=0,ow=0;S.people.forEach(function(p){var v=bal(p.id)[c]||0;if(v>0)to+=v;else ow-=v});return{to:to,ow:ow}}
function hue(n){var x=0;for(var i=0;i<n.length;i++)x=(x*31+n.charCodeAt(i))%360;return x}
function lastDate(id){var t=txOf(id).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.t-a.t})[0];return t?t.date:""}
function dueInfo(id){var b=bal(id),best=null,td=dnum(today());txOf(id).forEach(function(t){if(t.dir==1&&t.due&&(b[t.cur]||0)>0){var d=dnum(t.due)-td;if(best===null||d<best.d)best={d:d,cur:t.cur,date:t.due}}});return best}
function line(id){var b=bal(id),ks=Object.keys(b);if(!ks.length)return'<div class="amt mut">مسدّد ✓</div>';
 ks.sort(function(a,c){return Math.abs(b[c])-Math.abs(b[a])});var k=ks[0],v=b[k];
 return'<div class="amt '+(v>0?"pos":"neg")+'">'+money(v,k)+"<small>"+(v>0?"عليه لي":"علي له")+(ks.length>1?" +"+(ks.length-1):"")+"</small></div>"}

 var cs=used();if(!ui.cur||cs.indexOf(ui.cur)<0)ui.cur=S.cfg.cur;var t=totals(ui.cur);
 var html='<div class="sum"><div class="box p"><small>لي عند الناس</small><b>'+money(t.to,ui.cur)+'</b></div><div class="box n"><small>علي للناس</small><b>'+money(t.ow,ui.cur)+"</b></div></div>";
 html+='<div class="net"><span>الصافي: <b class="'+(t.to>=t.ow?"pos":"neg")+'">'+money(t.to-t.ow,ui.cur)+"</b></span><span>"+S.people.length+" شخص</span></div>";
 if(cs.length>1)html+='<div class="chips" role="group" aria-label="العملة">'+cs.map(function(c){return'<button class="chip" data-act="scur" data-v="'+c+'" aria-pressed="'+(ui.cur==c)+'">'+CUR[c].s+"</button>"}).join("")+"</div>";
 if(S.people.length){
  html+='<div class="chips">'+[["all","الكل"],["to","عليهم لي"],["ow","علي لهم"],["late","متأخر"]].map(function(f){return'<button class="chip" data-act="flt" data-v="'+f[0]+'" aria-pressed="'+(ui.flt==f[0])+'">'+f[1]+"</button>"}).join("")+"</div>";
  html+='<label class="sr" for="q">بحث</label><input class="fld" id="q" type="search" placeholder="ابحث باسم الشخص أو رقمه" value="'+h(ui.q)+'" autocomplete="off"><div class="list" id="list"></div>';
 }else{
  html+='<div class="empty" style="margin-top:16px"><h3>أهلاً بك في دفتر الديون</h3><div>سجّل من أخذ منك بالأجل ومن أخذت منه، وتابع كل شيء في مكان واحد.</div><div class="steps"><div><i>١</i><span>اضغط <b>+ شخص جديد</b> واكتب اسمه ورقمه.</span></div><div><i>٢</i><span>سجّل المبلغ: <b>أعطيته</b> إذا بعت له بالأجل أو سلّفته، و<b>أخذت منه</b> إذا سدّد لك أو أخذت منه.</span></div><div><i>٣</i><span>أرسل له تذكيراً بواتساب بضغطة زر عندما يحين موعد السداد.</span></div></div><button class="btn" data-act="newp">+ إضافة أول شخص</button><button class="btn ghost" data-act="demo">جرّب ببيانات مثال</button></div>';
 }
 $("app").innerHTML=html;if(S.people.length)list();
}
function list(){
 var q=ui.q.trim().toLowerCase(),L=S.people.filter(function(p){
  var b=bal(p.id),v=b[ui.cur]||0,ks=Object.keys(b);
  if(q&&(p.name+" "+(p.phone||"")).toLowerCase().indexOf(q)<0)return false;
  if(ui.flt=="to")return ks.some(function(k){return b[k]>0});
  if(ui.flt=="ow")return ks.some(function(k){return b[k]<0});
  if(ui.flt=="late"){var d=dueInfo(p.id);return d&&d.d<0}
  return true});
 L.sort(function(a,b){var x=Math.abs(bal(b.id)[ui.cur]||0)-Math.abs(bal(a.id)[ui.cur]||0);return x||(lastDate(b.id)<lastDate(a.id)?-1:1)});
 $("list").innerHTML=L.length?L.map(function(p){var ld=lastDate(p.id);return'<button class="row" data-act="open" data-id="'+p.id+'"><span class="av" style="--h:'+hue(p.name)+'">'+h(p.name.charAt(0))+'</span><span style="min-width:0"><div class="nm">'+h(p.name)+"</div><small>"+(ld?"آخر حركة "+dshow(ld):"بدون حركات")+"</small></span>"+line(p.id)+"</button>"}).join(""):'<div class="empty">لا نتائج.</div>';
}

 html+=L.length?L.map(function(x){var b=bal(x.p.id)[x.d.cur];var s=x.d.d<0?'<span class="neg">متأخر '+(-x.d.d)+" يوم</span>":x.d.d==0?'<span class="warn">اليوم</span>':'<span class="mut">بعد '+x.d.d+" يوم</span>";
  return'<button class="row" data-act="open" data-id="'+x.p.id+'"><span class="av" style="--h:'+hue(x.p.name)+'">'+h(x.p.name.charAt(0))+'</span><span style="min-width:0"><div class="nm">'+h(x.p.name)+"</div><small>"+s+" · "+dshow(x.d.date)+'</small></span><div class="amt pos">'+money(b,x.d.cur)+"</div></button>"}).join(""):'<div class="empty">لا توجد مواعيد سداد حالياً.<br>عند تسجيل دين، أضف «موعد السداد» وسيظهر هنا.</div>';
 $("app").innerHTML=html+"</div>";
}

function close(){$("ov").hidden=true;document.body.style.overflow="";ui.pid=null;ui.del=null;render()}
function head(t,back){return'<div class="ph"><h2>'+t+'</h2><button class="ib" data-act="'+(back||"close")+'" aria-label="إغلاق">✕</button></div>'}
function curChips(sel){return'<div class="chips" style="padding:0">'+Object.keys(CUR).map(function(c){return'<button class="chip" type="button" data-act="fcur" data-v="'+c+'" aria-pressed="'+(sel==c)+'">'+CUR[c].s+"</button>"}).join("")+"</div>"}
function personView(id){
 var p=person(id);if(!p){close();return}ui.pid=id;
 var b=bal(id),ks=Object.keys(b),tx=txOf(id).sort(function(a,c){return a.date<c.date?1:a.date>c.date?-1:c.t-a.t});
 var bl=ks.length?ks.map(function(k){return'<div class="big '+(b[k]>0?"pos":"neg")+'">'+money(b[k],k)+' <small style="font-size:14px;font-weight:400">'+(b[k]>0?"عليه لك":"عليك له")+"</small></div>"}).join(""):'<div class="big mut">لا يوجد دين ✓</div>';
 open(head(h(p.name))+(p.phone?'<div class="mut" dir="ltr" style="text-align:start">'+h(p.phone)+"</div>":"")+(p.note?'<div class="mut">'+h(p.note)+"</div>":"")+bl+
 '<div class="two" style="margin:12px 0"><button class="btn pos" data-act="tx" data-dir="1">أعطيته</button><button class="btn neg" data-act="tx" data-dir="-1">أخذت منه</button></div>'+
 '<div class="help" style="margin-bottom:10px"><b>أعطيته</b>: بعت له بالأجل أو سلّفته. <b>أخذت منه</b>: سدّد لك أو أخذت منه بالأجل.</div>'+
 '<div class="two">'+(ks.some(function(k){return b[k]>0})?'<a class="btn wa sm" target="_blank" rel="noopener" href="'+waLink(p.phone,remind(p))+'">تذكير بواتساب</a>':"<span></span>")+'<button class="btn ghost sm" data-act="stmt">كشف حساب</button></div>'+
 '<h2 class="s" style="margin-top:18px">الحركات</h2>'+(tx.length?tx.map(function(t){var dd=t.due&&t.dir==1?dnum(t.due)-dnum(today()):null;var late=dd!==null&&dd<0&&(b[t.cur]||0)>0;
  return'<button class="tx" data-act="etx" data-id="'+t.id+'"><span><b>'+(t.dir==1?"أعطيته":"أخذت منه")+"</b>"+(t.due&&t.dir==1?'<span class="tag'+(late?" late":"")+'">'+(late?"متأخر · ":"استحقاق ")+dshow(t.due)+"</span>":"")+'</span><span class="'+(t.dir==1?"pos":"neg")+'" style="font-weight:600;font-variant-numeric:tabular-nums">'+(t.dir==1?"+":"−")+money(t.amt,t.cur)+"</span><small>"+dshow(t.date)+(t.note?" · "+h(t.note):"")+"</small><span></span></button>"}).join(""):'<div class="empty">لا توجد حركات بعد. اضغط «أعطيته» أو «أخذت منه».</div>')+
 '<div class="two" style="margin-top:18px"><button class="btn ghost sm" data-act="editp">تعديل البيانات</button><button class="btn ghost sm" data-act="delp">'+(ui.del==id?"تأكيد حذف الشخص":"حذف الشخص")+"</button></div>");
}
function remind(p){var b=bal(p.id),ks=Object.keys(b).filter(function(k){return b[k]>0});var amt=ks.length?ks.map(function(k){return money(b[k],k)}).join(" و "):"";return S.cfg.msg.replace(/\{الاسم\}/g,p.name).replace(/\{المبلغ\}/g,amt||"المبلغ").replace(/\{المحل\}/g,S.cfg.shop||"المحل")}
function stmt(p){
 var tx=txOf(p.id).sort(function(a,c){return a.date>c.date?1:a.date<c.date?-1:a.t-c.t});
 var t="كشف حساب: "+p.name+(S.cfg.shop?"\n"+S.cfg.shop:"")+"\n————————\n"+tx.map(function(x){return dshow(x.date)+"  "+(x.dir==1?"عليك":"لك")+"  "+money(x.amt,x.cur)+(x.note?"  ("+x.note+")":"")}).join("\n")+"\n————————\n";
 var b=bal(p.id),ks=Object.keys(b);t+=ks.length?ks.map(function(k){return(b[k]>0?"المتبقي عليك: ":"المتبقي لك: ")+money(b[k],k)}).join("\n"):"الحساب مسدّد، لا يوجد متبقٍ.";return t}
function txForm(dir,tid){
 var t=tid?S.tx.filter(function(x){return x.id==tid})[0]:null,p=person(ui.pid);dir=t?t.dir:dir;ui.dir=dir;ui.tid=tid||null;ui.formCur=t?t.cur:(ui.formCur||S.cfg.cur);
 open(head((t?"تعديل: ":"")+(dir==1?"أعطيته":"أخذت منه")+" · "+h(p.name),"back")+'<div class="help">'+(dir==1?"اكتب المبلغ الذي بعته له بالأجل أو سلّفته إياه.":"اكتب المبلغ الذي سدّده لك أو أخذته منه.")+'</div><div class="form"><label class="lab">المبلغ<input class="fld" id="f_amt" inputmode="decimal" autocomplete="off" value="'+(t?t.amt:"")+'" placeholder="0" style="font-size:22px;height:54px"></label><div class="lab">العملة'+curChips(ui.formCur)+'</div><label class="lab">ملاحظة (اختياري)<input class="fld" id="f_note" value="'+h(t?t.note:"")+'" placeholder="مثال: بضاعة، سلفة، دفعة أولى"></label><div class="two"><label class="lab">التاريخ<input class="fld" id="f_date" type="date" value="'+(t?t.date:today())+'"></label>'+(dir==1?'<label class="lab">موعد السداد (اختياري)<input class="fld" id="f_due" type="date" value="'+(t&&t.due?t.due:"")+'"></label>':"<span></span>")+'</div><div class="err" id="er"></div><button class="btn '+(dir==1?"pos":"neg")+'" data-act="savetx">حفظ</button>'+(t?'<button class="btn ghost" data-act="deltx">'+(ui.del=="tx"?"تأكيد الحذف":"حذف الحركة")+"</button>":"")+"</div>");

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
 var b=ev.target.closest("[data-act]");if(ev.target.id=="ov"){close();return}if(!b)return;var a=b.dataset.act,d=b.dataset;
 switch(a){
 case"tab":ui.tab=d.v;render();window.scrollTo(0,0);break;

 case"flt":ui.flt=d.v;book();break;

 case"close":close();break;
 case"back":ui.del=null;personView(ui.pid);break;
 case"newp":ui.formCur=S.cfg.cur;pForm(null);break;
 case"editp":pForm(person(ui.pid));break;
 case"fcur":ui.formCur=d.v;[].forEach.call(document.querySelectorAll('[data-act="fcur"]'),function(x){x.setAttribute("aria-pressed",x.dataset.v==d.v)});break;

  var p={id:uid(),name:nm,phone:$("n_phone").value.trim(),note:$("n_note").value.trim(),created:Date.now()};S.people.push(p);
  var am=num($("n_amt").value);if(am>0)S.tx.push({id:uid(),pid:p.id,dir:+$("n_dir").value,amt:am,cur:ui.formCur,date:today(),due:"",note:"",t:Date.now()});
  save();toast("تمت الإضافة");personView(p.id);break;
 case"savepe":var q=person(ui.pid),n2=$("n_name").value.trim();if(!n2){$("er").textContent="اكتب اسم الشخص.";break}q.name=n2;q.phone=$("n_phone").value.trim();q.note=$("n_note").value.trim();save();toast("تم الحفظ");personView(q.id);break;
 case"delp":if(ui.del==ui.pid){S.people=S.people.filter(function(x){return x.id!=ui.pid});S.tx=S.tx.filter(function(x){return x.pid!=ui.pid});save();toast("تم حذف الشخص");close()}else{ui.del=ui.pid;personView(ui.pid)}break;
 case"tx":txForm(+d.dir,null);break;
 case"etx":txForm(0,d.id);break;
